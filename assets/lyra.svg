<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 512" role="img" aria-label="System diagram of Lyra: Claude Code calls five MCP tools on the Lyra server, which go through one typed stage core; separate adapters for WiQAS and Orion run each project&#x27;s own Python environment as a subprocess, speaking JSON over stdin and stdout.">
<defs><marker id="lyra-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-arrow" d="M0 1 L9 5 L0 9 z"/></marker></defs>
