<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 624" role="img" aria-label="System diagram of TMWA: GitHub Actions builds images, ArgoCD syncs a Helm chart into Kubernetes, where an NGINX ingress fronts a Next.js app that calls eight microservices, Redis, MinIO and Meilisearch, with PostgreSQL on Supabase outside the cluster.">
<defs><marker id="tmwa-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-arrow" d="M0 1 L9 5 L0 9 z"/></marker></defs>
